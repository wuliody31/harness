services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    volumes:
      - ../../migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    ports: ['5432:5432']
  temporal:
    image: temporalio/auto-setup:1.27.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: harness
      POSTGRES_PWD: harness
      POSTGRES_SEEDS: postgres
    depends_on: [postgres]
    ports: ['7233:7233']
  temporal-ui:
    image: temporalio/ui:2.34.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on: [temporal]
    ports: ['8088:8080']
  opa:
    image: openpolicyagent/opa:latest
    command: [run, --server]
    ports: ['8181:8181']
  jaeger:
    image: jaegertracing/all-in-one:1.74
    ports: ['16686:16686', '4317:4317']
  control-plane:
    build:
      context: ../..
      dockerfile: deploy/docker/control-plane.Dockerfile
    environment:
      DATABASE_URL: postgres://harness:harness@postgres:5432/harness?sslmode=disable
      TEMPORAL_ADDRESS: temporal:7233
    depends_on: [postgres, temporal, workflow-worker]
    ports: ["8080:8080"]
  workflow-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/workflow-worker.Dockerfile
    environment:
      DATABASE_URL: postgres://harness:harness@postgres:5432/harness?sslmode=disable
      TEMPORAL_ADDRESS: temporal:7233
    depends_on: [postgres, temporal]
